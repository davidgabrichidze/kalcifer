services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kalcifer_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/app
      - deps:/app/deps
      - build:/app/_build
    ports:
      - "4500:4500"
    env_file:
      - .env
    environment:
      MIX_ENV: dev
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: ecto://postgres:postgres@postgres/kalcifer_dev
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:4500
      VITE_WS_URL: ws://localhost:4500

volumes:
  postgres_data:
  deps:
  build:
  frontend_node_modules:
