<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalcifer — Automation Partner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --bg:#f5f0eb;--surface:#ffffff;--surface-dim:#faf7f4;
  --primary:#c4956a;--primary-hover:#b5845c;--primary-soft:rgba(196,149,106,0.10);
  --accent:#8b7355;--accent-soft:rgba(139,115,85,0.08);
  --border:#e8ddd3;--border-light:#f0e8df;
  --text:#2d2a26;--text-sec:#6b6560;--text-muted:#a09890;--text-on-primary:#fff;
  --success:#5a9e6f;--success-soft:rgba(90,158,111,0.08);
  --warn:#c49a5c;--warn-soft:rgba(196,154,92,0.08);
  --danger:#c47a6e;--danger-soft:rgba(196,122,110,0.08);
  --info:#6a8fa0;--info-soft:rgba(106,143,160,0.08);
  --radius:14px;--radius-sm:10px;--radius-xs:6px;
}
[data-theme="lavender"]{--bg:#f7f5f0;--surface:#fff;--surface-dim:#f5f2f8;--primary:#9b8ec4;--primary-hover:#8a7db5;--primary-soft:rgba(155,142,196,0.10);--accent:#7c6fa0;--accent-soft:rgba(124,111,160,0.08);--border:#e6e1ec;--border-light:#eeebf3;--text:#2d2a33;--text-sec:#65606e;--text-muted:#9e96a8;--success:#6a9e7a;--success-soft:rgba(106,158,122,0.08);--warn:#c4a05c;--warn-soft:rgba(196,160,92,0.08);--danger:#c47a6e;--danger-soft:rgba(196,122,110,0.08);--info:#7a8ec4;--info-soft:rgba(122,142,196,0.08)}
[data-theme="sage"]{--bg:#f4f1ec;--surface:#fefdfb;--surface-dim:#f6f4f0;--primary:#6b8f6e;--primary-hover:#5c7e60;--primary-soft:rgba(107,143,110,0.10);--accent:#4a6b4d;--accent-soft:rgba(74,107,77,0.08);--border:#e2ddd6;--border-light:#eae6e0;--text:#2a2d28;--text-sec:#5c5f58;--text-muted:#969990;--success:#6b8f6e;--success-soft:rgba(107,143,110,0.08);--warn:#c49a5c;--warn-soft:rgba(196,154,92,0.08);--danger:#b86e5a;--danger-soft:rgba(184,110,90,0.08);--info:#5a8b9e;--info-soft:rgba(90,139,158,0.08)}
[data-theme="teal"]{--bg:#f5f2ed;--surface:#fff;--surface-dim:#f9f7f4;--primary:#3d8b80;--primary-hover:#2d7b70;--primary-soft:rgba(61,139,128,0.10);--accent:#2d6b62;--accent-soft:rgba(45,107,98,0.08);--border:#e5dfd8;--border-light:#ede8e2;--text:#2a2825;--text-sec:#5c5855;--text-muted:#9a9590;--success:#5a9e6f;--success-soft:rgba(90,158,111,0.08);--warn:#c4956a;--warn-soft:rgba(196,149,106,0.08);--danger:#c47a6e;--danger-soft:rgba(196,122,110,0.08);--info:#3d8b80;--info-soft:rgba(61,139,128,0.08)}
[data-theme="dark"]{--bg:#0f0f14;--surface:#1a1a24;--surface-dim:#141420;--primary:#a89cf0;--primary-hover:#bdb3f5;--primary-soft:rgba(168,156,240,0.10);--accent:#c4b8f0;--accent-soft:rgba(196,184,240,0.06);--border:#2a2a3a;--border-light:#22222f;--text:#e4e2ec;--text-sec:#9896a8;--text-muted:#5c5a6e;--text-on-primary:#0f0f14;--success:#6ee0a0;--success-soft:rgba(110,224,160,0.08);--warn:#f0c060;--warn-soft:rgba(240,192,96,0.08);--danger:#f08070;--danger-soft:rgba(240,128,112,0.08);--info:#70b0f0;--info-soft:rgba(112,176,240,0.08)}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;transition:background 0.4s,color 0.3s}

/* ═══ LAYOUT ═══ */
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:48px 1fr;height:100vh}

/* ═══ TOPBAR ═══ */
.topbar{grid-column:1/-1;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;transition:all 0.3s}
.top-left{display:flex;align-items:center;gap:14px}
.logo{font-size:17px;font-weight:700;color:var(--primary);letter-spacing:-0.5px}
.logo span{font-weight:400;color:var(--text-muted);font-size:12px}
.top-right{display:flex;align-items:center;gap:6px}
.top-btn{background:var(--surface-dim);border:1px solid var(--border);color:var(--text-sec);height:30px;padding:0 10px;border-radius:var(--radius-xs);cursor:pointer;font-size:11px;font-family:inherit;display:flex;align-items:center;gap:4px;transition:all 0.2s}
.top-btn:hover{border-color:var(--primary);color:var(--text)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--text-on-primary);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}

/* Theme */
.theme-wrap{position:relative}
.theme-dd{display:none;position:absolute;top:36px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;box-shadow:0 4px 16px rgba(0,0,0,0.1);z-index:500;min-width:160px}
.theme-dd.open{display:block}
.th-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius-xs);cursor:pointer;font-size:11px;color:var(--text-sec);border:none;background:none;width:100%;font-family:inherit;transition:all 0.15s}
.th-opt:hover{background:var(--primary-soft)}
.th-opt.active{color:var(--primary);font-weight:600}
.th-sw{display:flex;gap:2px}
.th-sw i{width:10px;height:10px;border-radius:2px;display:block}

/* ═══ SIDEBAR ═══ */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:all 0.3s}
.sb-section{padding:10px 10px 4px}
.sb-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);padding:0 6px;margin-bottom:4px}
.sb-new{display:flex;align-items:center;gap:6px;width:100%;padding:7px 10px;background:var(--primary-soft);border:1px dashed var(--primary);border-radius:var(--radius-sm);color:var(--primary);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all 0.2s;margin-bottom:6px}
.sb-new:hover{background:var(--primary);color:var(--text-on-primary);border-style:solid}
.sb-scroll{flex:1;overflow-y:auto;padding:0 10px}
.sb-scroll::-webkit-scrollbar{width:3px}
.sb-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.camp-item{display:flex;align-items:flex-start;gap:8px;padding:8px;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.15s;margin-bottom:2px;border:1px solid transparent}
.camp-item:hover{background:var(--surface-dim)}
.camp-item.active{background:var(--primary-soft);border-color:var(--primary)}
.camp-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0}
.dot-plan{background:var(--info)} .dot-live{background:var(--success);animation:pulse 2s infinite} .dot-done{background:var(--border)} .dot-draft{background:var(--text-muted)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.camp-info{flex:1;min-width:0}
.camp-name{font-size:12px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp-meta{font-size:10px;color:var(--text-muted);margin-top:1px}

.sb-bottom{padding:8px 10px;border-top:1px solid var(--border)}
.tenant-btn{display:flex;align-items:center;gap:6px;width:100%;padding:6px 8px;background:var(--surface-dim);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:11px;color:var(--text-sec);cursor:pointer;font-family:inherit}
.t-dot{width:6px;height:6px;border-radius:50%;background:var(--success)}

/* ═══ MAIN CONTENT AREA ═══ */
.main-area{display:flex;overflow:hidden;min-height:0}

/* Adaptive layout transitions */
.main-area{transition:all 0.4s ease}

/* ─── Chat Column ─── */
.chat-col{display:flex;flex-direction:column;overflow:hidden;min-height:0;border-right:1px solid var(--border);background:var(--bg);transition:width 0.4s ease,flex 0.4s ease}

.chat-head{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.chat-head-left{display:flex;align-items:center;gap:8px}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulse 2.5s infinite}
.chat-head h2{font-size:13px;font-weight:600}
.phase-tag{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:600}

.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;min-height:0}
.chat-msgs::-webkit-scrollbar{width:4px}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.msg{display:flex;gap:8px;animation:msgIn 0.3s ease}
.msg-user{flex-direction:row-reverse}
@keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg-av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600}
.msg-ai .msg-av{background:var(--primary-soft);color:var(--primary);border:1px solid var(--border)}
.msg-user .msg-av{background:var(--surface-dim);color:var(--text-muted);border:1px solid var(--border)}
.msg-body{padding:10px 14px;border-radius:var(--radius);font-size:12.5px;line-height:1.6;max-width:90%}
.msg-ai .msg-body{background:var(--surface);border:1px solid var(--border)}
.msg-user .msg-body{background:var(--primary);color:var(--text-on-primary)}
.msg-body code{background:var(--accent-soft);padding:1px 4px;border-radius:3px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--accent)}
.msg-body table{width:100%;border-collapse:collapse;margin:6px 0;font-size:11px}
.msg-body th,.msg-body td{padding:4px 6px;border:1px solid var(--border);text-align:left}
.msg-body th{background:var(--surface-dim);color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:0.3px;font-weight:600}

.msg-btn{display:inline-flex;align-items:center;gap:4px;margin-top:6px;margin-right:4px;padding:5px 10px;border-radius:var(--radius-xs);font-size:11px;font-family:inherit;cursor:pointer;transition:all 0.2s;font-weight:500;border:none}
.msg-btn-p{background:var(--primary);color:var(--text-on-primary)}
.msg-btn-p:hover{background:var(--primary-hover)}
.msg-btn-s{background:var(--surface-dim);color:var(--text-sec);border:1px solid var(--border)}
.msg-btn-s:hover{border-color:var(--primary);color:var(--text)}

/* Journey visual */
.journey-v{margin:8px 0;padding:10px;background:var(--surface-dim);border-radius:var(--radius-sm);border:1px solid var(--border-light)}
.j-step{display:flex;align-items:flex-start;gap:8px;padding:5px 0;position:relative}
.j-step:not(:last-child)::after{content:'';position:absolute;left:10px;top:20px;bottom:-5px;width:1px;background:var(--border)}
.j-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;background:var(--surface);border:2px solid var(--border);z-index:1}
.j-dot.done{border-color:var(--success);color:var(--success);background:var(--success-soft)}
.j-dot.active{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.j-dot.pending{border-color:var(--border);color:var(--text-muted)}
.j-info{flex:1}
.j-name{font-size:11px;font-weight:500}
.j-desc{font-size:10px;color:var(--text-muted)}

.suggestions{padding:6px 16px;display:flex;flex-wrap:wrap;gap:4px;flex-shrink:0}
.sug{background:var(--surface);border:1px solid var(--border);color:var(--text-sec);padding:4px 10px;border-radius:16px;font-size:10.5px;cursor:pointer;font-family:inherit;transition:all 0.2s}
.sug:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}

.chat-input-area{padding:10px 16px 12px;flex-shrink:0;border-top:1px solid var(--border)}
.chat-input-wrap{display:flex;align-items:flex-end;gap:6px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:8px 12px;transition:all 0.2s}
.chat-input-wrap:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.chat-input{flex:1;background:none;border:none;color:var(--text);font-size:13px;font-family:inherit;resize:none;outline:none;max-height:80px;line-height:1.5}
.chat-input::placeholder{color:var(--text-muted)}
.send-btn{background:var(--primary);border:none;color:var(--text-on-primary);width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.send-btn:hover{background:var(--primary-hover)}
.send-btn svg{width:13px;height:13px}

.typing-ind{display:flex;gap:3px;padding:3px 0}
.typing-ind span{width:5px;height:5px;border-radius:50%;background:var(--primary);animation:td 1.2s infinite}
.typing-ind span:nth-child(2){animation-delay:0.2s}.typing-ind span:nth-child(3){animation-delay:0.4s}
@keyframes td{0%,60%,100%{opacity:0.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ─── Dashboard Column ─── */
.dash-col{flex:1;overflow-y:auto;padding:16px;background:var(--bg);transition:all 0.4s ease;min-height:0}
.dash-col::-webkit-scrollbar{width:5px}
.dash-col::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dash-title{font-size:15px;font-weight:600}
.dash-subtitle{font-size:11px;color:var(--text-muted)}

/* Dashboard grid */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:16px}

.d-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;transition:all 0.2s}
.d-card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.d-card.wide{grid-column:span 2}
.d-card.full{grid-column:1/-1}

.d-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted)}
.d-value{font-size:24px;font-weight:700;color:var(--primary);margin-top:3px}
.d-change{font-size:10px;margin-top:2px}
.change-up{color:var(--success)}.change-down{color:var(--danger)}

.d-section-title{font-size:12px;font-weight:600;color:var(--text);margin:14px 0 8px;display:flex;align-items:center;gap:6px}

/* Progress bars */
.prog-row{margin-bottom:10px}
.prog-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.prog-label span:first-child{color:var(--text-sec)}
.prog-label span:last-child{font-weight:600;color:var(--text)}
.prog-bar{height:8px;background:var(--surface-dim);border-radius:4px;overflow:hidden;border:1px solid var(--border-light)}
.prog-fill{height:100%;border-radius:3px;transition:width 1s ease}

/* Live stream mini */
.live-mini{font-family:'JetBrains Mono',monospace;font-size:10px;max-height:160px;overflow-y:auto;background:var(--surface-dim);border-radius:var(--radius-sm);padding:8px;border:1px solid var(--border-light)}
.live-mini::-webkit-scrollbar{width:3px}
.live-mini::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.lm-ev{padding:2px 0;border-bottom:1px solid var(--border-light);display:flex;gap:6px}
.lm-ev:last-child{border:none}
.lm-time{color:var(--text-muted);min-width:55px}
.lm-name{color:var(--primary)}
.lm-detail{color:var(--text-sec)}

/* Chart */
.chart-box{position:relative;height:180px}

/* Table mini */
.d-table{width:100%;border-collapse:collapse;font-size:11px}
.d-table th{text-align:left;padding:5px 6px;color:var(--text-muted);font-weight:500;text-transform:uppercase;font-size:9px;letter-spacing:0.5px;border-bottom:1px solid var(--border)}
.d-table td{padding:5px 6px;border-bottom:1px solid var(--border-light);color:var(--text-sec)}
.d-table tr:hover td{background:var(--primary-soft)}

.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:500}
.b-green{background:var(--success-soft);color:var(--success)}
.b-orange{background:var(--warn-soft);color:var(--warn)}
.b-red{background:var(--danger-soft);color:var(--danger)}
.b-blue{background:var(--info-soft);color:var(--info)}

/* Funnel */
.funnel{display:flex;flex-direction:column;gap:3px}
.funnel-step{display:flex;align-items:center;gap:8px}
.funnel-bar{height:24px;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:600;color:white;transition:width 0.8s ease}
.funnel-label{font-size:10px;color:var(--text-muted);min-width:70px}
.funnel-val{font-size:10px;color:var(--text-sec);min-width:50px;text-align:right}

/* Empty dash state */
.dash-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--text-muted)}
.dash-empty-icon{font-size:48px;margin-bottom:10px;opacity:0.3}
.dash-empty h3{font-size:15px;color:var(--text-sec);font-weight:500;margin-bottom:4px}
.dash-empty p{font-size:12px;max-width:280px;line-height:1.5}

/* Insight cards */
.insight{padding:8px 10px;border-left:3px solid;border-radius:0 var(--radius-xs) var(--radius-xs) 0;margin-bottom:6px}
.insight-type{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.insight-text{font-size:11px;margin-top:2px;color:var(--text-sec);line-height:1.4}

/* Settings → separate page */
</style>
</head>
<body data-theme="warm">
<div class="app">

<!-- TOPBAR -->
<div class="topbar">
  <div class="top-left"><div class="logo">Kalcifer <span>Work</span></div></div>
  <div class="top-right">
    <button class="top-btn" onclick="window.location.href='browse.html?theme='+(document.body.getAttribute('data-theme')||'warm')" title="დათვალიერება">👁 Browse</button>
    <button class="top-btn" onclick="openSettings()">⚙</button>
    <div class="theme-wrap">
      <button class="top-btn" onclick="document.getElementById('thDD').classList.toggle('open')">◐</button>
      <div class="theme-dd" id="thDD">
        <button class="th-opt active" onclick="setTh('warm',this)"><span class="th-sw"><i style="background:#f5f0eb"></i><i style="background:#c4956a"></i></span>Warm Paper</button>
        <button class="th-opt" onclick="setTh('lavender',this)"><span class="th-sw"><i style="background:#f7f5f0"></i><i style="background:#9b8ec4"></i></span>Lavender</button>
        <button class="th-opt" onclick="setTh('sage',this)"><span class="th-sw"><i style="background:#f4f1ec"></i><i style="background:#6b8f6e"></i></span>Sand & Sage</button>
        <button class="th-opt" onclick="setTh('teal',this)"><span class="th-sw"><i style="background:#f5f2ed"></i><i style="background:#3d8b80"></i></span>Paper & Teal</button>
        <button class="th-opt" onclick="setTh('dark',this)"><span class="th-sw"><i style="background:#0f0f14"></i><i style="background:#a89cf0"></i></span>Dark</button>
      </div>
    </div>
    <div class="avatar">დგ</div>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sb-section">
    <button class="sb-new">+ ახალი კამპანია</button>
    <div class="sb-label">მიმდინარე</div>
  </div>
  <div class="sb-scroll">
    <div class="camp-item active" id="camp-re" onclick="loadCampaign('planning')">
      <div class="camp-dot dot-plan"></div>
      <div class="camp-info"><div class="camp-name">Churn Re-engagement</div><div class="camp-meta">📝 Planning · 1,880 profiles</div></div>
    </div>
    <div class="camp-item" id="camp-spring" onclick="loadCampaign('live')">
      <div class="camp-dot dot-live"></div>
      <div class="camp-info"><div class="camp-name">Spring Sale Push</div><div class="camp-meta">🚀 Live · 67% sent</div></div>
    </div>
    <div class="camp-item" id="camp-onb" onclick="loadCampaign('live-onb')">
      <div class="camp-dot dot-live"></div>
      <div class="camp-info"><div class="camp-name">Onboarding Flow v3</div><div class="camp-meta">🚀 Live · 2,100 in journey</div></div>
    </div>
    <div style="padding:8px 6px 4px"><div class="sb-label">დასრულებული</div></div>
    <div class="camp-item" id="camp-q4" onclick="loadCampaign('done')">
      <div class="camp-dot dot-done"></div>
      <div class="camp-info"><div class="camp-name">Q4 Upsell Campaign</div><div class="camp-meta">✅ 12.4% conversion</div></div>
    </div>

// ═══ HELPERS ═══
function setPhaseTag(text,bg,color){
  const tag=document.getElementById('phaseTag');
  tag.innerHTML=text;tag.style.background=bg;tag.style.color=color;
}

function addAI(html){
  const d=document.createElement('div');d.className='msg msg-ai';
  d.innerHTML=`<div class="msg-av">O</div><div class="msg-body">${html}</div>`;
  chatMsgs.appendChild(d);chatMsgs.scrollTop=chatMsgs.scrollHeight;
}
function addUser(text){
  const d=document.createElement('div');d.className='msg msg-user';
  d.innerHTML=`<div class="msg-av">დგ</div><div class="msg-body">${text}</div>`;
  chatMsgs.appendChild(d);chatMsgs.scrollTop=chatMsgs.scrollHeight;
}
function addTyping(){
  const d=document.createElement('div');d.className='msg msg-ai';d.id='typing';
  d.innerHTML='<div class="msg-av">O</div><div class="msg-body"><div class="typing-ind"><span></span><span></span><span></span></div></div>';
  chatMsgs.appendChild(d);chatMsgs.scrollTop=chatMsgs.scrollHeight;
}

function setSugs(list){
  const el=document.getElementById('sugs');
  el.style.display='flex';
  el.innerHTML=list.map(s=>`<button class="sug" onclick="ask('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('');
}

function ask(text){chatInput.value=text;sendMsg()}
function sendMsg(){
  const text=chatInput.value.trim();if(!text)return;
  addUser(text);chatInput.value='';chatInput.style.height='auto';
  document.getElementById('sugs').style.display='none';
  addTyping();
  setTimeout(()=>{document.getElementById('typing')?.remove();respond(text)},600+Math.random()*400);
}

function respond(text){
  const t=text.toLowerCase();
  if(t.includes('email')&&t.includes('sms')||t.includes('re-activation')){
    addAI(`კარგი! Email + SMS, re-activation მიზნით:<br>
    <div class="journey-v">

function startLiveStream(){
  const evts=['email_sent','email_opened','email_clicked','sms_queued','page_view','purchase','button_click'];
  const users=['ana@acme.io','luka@nova.shop','nino@spark.tv','giorgi@acme.io','mariam@nova.shop','dato@spark.tv'];
  function addEv(){
    const s=document.getElementById('liveStream');if(!s){clearInterval(liveInterval);return}
    const n=new Date(),tm=`${n.getHours().toString().padStart(2,'0')}:${n.getMinutes().toString().padStart(2,'0')}:${n.getSeconds().toString().padStart(2,'0')}`;
    const d=document.createElement('div');d.className='lm-ev';
    d.innerHTML=`<span class="lm-time">${tm}</span><span class="lm-name">${evts[Math.floor(Math.random()*evts.length)]}</span><span class="lm-detail">${users[Math.floor(Math.random()*users.length)]}</span>`;
    s.insertBefore(d,s.firstChild);
    if(s.children.length>30)s.removeChild(s.lastChild);
  }
  for(let i=0;i<5;i++)addEv();
  liveInterval=setInterval(addEv,1200);
}
